[project]
name = "uk-wind-api"
version = "1.0.0"
description = "UK Wind Forecast Decision & Accuracy Portal API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "python-dateutil>=2.9.0",
    "pytz>=2024.1",
    "httpx>=0.27.0",
]

[tool.vercel]
entrypoint = "main:app"
